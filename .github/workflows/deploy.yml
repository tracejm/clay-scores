# GitHub Actions: every time code is pushed to "main", GitHub's own servers
# install the tools, run the tests, build the app and publish it to
# GitHub Pages. Nobody has to compile anything by hand.
name: Test, build and publish

on:
  push:
    branches: [main]
  workflow_dispatch: # also lets you run it from the Actions tab with a button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
